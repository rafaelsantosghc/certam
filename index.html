<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var OriginalWebSocket = window.WebSocket;
      if (!OriginalWebSocket) return;
      function SafeWebSocket(url, protocols) {
        if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('token=') !== -1)) {
          return {
            url: url,
            readyState: 1,
            OPEN: 1,
            CONNECTING: 0,
            CLOSING: 2,
            CLOSED: 3,
            protocol: 'vite-hmr',
            extensions: '',
            bufferedAmount: 0,
            binaryType: 'blob',
            addEventListener: function () {},
            removeEventListener: function () {},
            dispatchEvent: function () { return true; },
            send: function () {},
            close: function () {}
          };
        }
        return protocols !== undefined
          ? new OriginalWebSocket(url, protocols)
          : new OriginalWebSocket(url);
      }
      SafeWebSocket.prototype = OriginalWebSocket.prototype;
      SafeWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
      SafeWebSocket.OPEN = OriginalWebSocket.OPEN;
      SafeWebSocket.CLOSING = OriginalWebSocket.CLOSING;
      SafeWebSocket.CLOSED = OriginalWebSocket.CLOSED;
      window.WebSocket = SafeWebSocket;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function () {});
      }
      if ('caches' in window) {
        window.caches.keys().then(function (keys) {
          for (var j = 0; j < keys.length; j++) {
            window.caches.delete(keys[j]);
          }
        }).catch(function () {});
      }
    })();
  </script>
